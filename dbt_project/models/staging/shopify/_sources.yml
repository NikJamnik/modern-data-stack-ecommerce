version: 2

sources:
  - name: shopify
    description: |
      Raw Shopify e-commerce data, loaded from CSV files via 
      `ingestion/load_to_duckdb.py`. All columns stored as VARCHAR
      to preserve source data verbatim — typing happens in staging.
    
    schema: raw
    
    # Note: tables in `raw` schema are named with `shopify__` prefix
    # (matches our project narrative — Olist data plays the role of Shopify).
    tables:
      
      - name: shopify__orders
        description: "Order header records, one row per order"
        columns:
          - name: order_id
            description: "Unique order identifier"
            tests:
              - not_null
              - unique
          - name: customer_id
            description: "FK to customers"
            tests:
              - not_null
      
      - name: shopify__customers
        description: "Customer dimension data"
        columns:
          - name: customer_id
            description: "Unique customer identifier per order. NOT a stable user ID."
            tests:
              - not_null
              - unique
      
      - name: shopify__order_items
        description: "Line items within orders, multiple rows per order"
        columns:
          - name: order_id
            description: "FK to orders"
            tests:
              - not_null
          - name: product_id
            description: "FK to products"
            tests:
              - not_null
      
      - name: shopify__products
        description: "Product catalog"
        columns:
          - name: product_id
            description: "Unique product identifier"
            tests:
              - not_null
              - unique
      
      - name: shopify__payments
        description: "Payment records, can have multiple installments per order"
        columns:
          - name: order_id
            description: "FK to orders"
            tests:
              - not_null
      
      - name: shopify__product_categories
        description: "Translation table for product category names"
        columns:
          - name: product_category_name
            description: "Original category name (Portuguese)"
            tests:
              - not_null
              - unique

version: 2

models:
  - name: dim_products
    description: |
      Dimension table for products. Combines product identity and computed metrics.
      Adds computed product segmentation for analytics.

    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Original category name (Portuguese)."

      - name: product_category_name_english
        description: "Translation of product category to English."

      - name: product_weight_g
        description: "Product weight measured in grams."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 50000
              row_condition: "product_weight_g is not null"

      - name: times_ordered
        description: "Number of times product appeared in a purchased orders"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000

      - name: unique_buyers
        description: "Number of unique clients who bought the product"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000

      - name: total_revenue
        description: "Sum of sold product prices"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 200000

      - name: avg_price
        description: "Average price of the product during the period when it was sold"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 20000

      - name: first_sold_date
        description: "Date when product was purchased for the first time"
        tests:
          - not_null

      - name: last_sold_date
        description: "Date when product was purchased for the last time (till current date)"
        tests:
          - not_null

      - name: product_status
        description: "Status of the product based on business segmentation"
        tests:
          - not_null
          - accepted_values:
              values: ["Top Seller", "Regular", "Slow Mover"]


  - name: fct_orders
    description: |
      Order-level fact table.
      Grain: one row per order_id.
      
      Materialization: incremental with late-arriving fact strategy
      (re-processes last 7 days on each non-full-refresh run).
      
      Denormalizes customer_segment, customer_state, customer_city for
      self-service BI — analysts can group by these fields without joining
      dim_customers.
      
      Known data finding: 775 orders have zero items (items_in_order=0).
      Likely orders canceled before items were assigned, or data quality 
      issue in source.
    
    columns:
      - name: order_id
        description: "Unique order identifier (primary key)"
        tests:
          - not_null
          - unique
      
      - name: customer_unique_id
        description: "FK to dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id
      
      - name: order_gmv
        description: |
          Gross Merchandise Value: sum(price + freight_value) of all items.
          In BRL. Zero for orders with no items (775 known cases).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
      
      - name: items_in_order
        description: "Number of line items in the order. Zero is possible (see model description)."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 50
      
      - name: order_status
        description: "Order lifecycle state (degenerate dimension)"
        tests:
          - not_null
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      
      - name: order_purchase_timestamp
        description: "When customer placed the order"
        tests:
          - not_null
      
      - name: customer_segment
        description: "Denormalized from dim_customers for self-service BI"
        tests:
          - not_null
          - accepted_values:
              values: [Champion, "New Customer", "At Risk", "One-Time", Unknown]
      
      - name: customer_state
        description: "Denormalized from dim_customers for self-service BI"
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              value: 2

  - name: dim_customers
    description: |
      Customer dimension table for analytics.
      One row per real customer (customer_unique_id).
      
      Combines identity, order metrics, revenue, and RFM-style segmentation.
      
      Key business finding: 96.9% of customers are One-Time — significant 
      retention problem on the platform.
    
    columns:
      - name: customer_unique_id
        description: "Stable customer identifier (primary key)"
        tests:
          - not_null
          - unique
      
      - name: customer_state
        description: "Brazilian state from customer's most recent order"
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              value: 2
      
      - name: customer_city
        description: "City from customer's most recent order"
        tests:
          - not_null
      
      - name: total_orders
        description: "Total number of orders by this customer"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 100
      
      - name: total_gmv
        description: |
          Gross Merchandise Value: sum of (price + freight_value) across 
          all items in all customer's orders. In BRL.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
      
      - name: avg_order_value
        description: "GMV / total_orders. Defaults to 0 for customers with 0 orders."
        tests:
          - not_null
      
      - name: days_since_last_order
        description: "Days between last order and analysis_as_of_date"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1000
      
      - name: customer_segment
        description: |
          RFM-style segmentation: Champion, New Customer, At Risk, One-Time, Unknown.
          Based on total_orders and days_since_last_order with 30-day cutoff.
        tests:
          - accepted_values:
              values: ["Champion", "New Customer", "At Risk", "One-Time", "Unknown"]
      
      - name: analysis_as_of_date
        description: |
          Reference date used for recency calculation.
          Same value for all rows in this snapshot. Helpful for debugging.
        tests:
          - not_null

[project]
name = "modern-data-stack-ecommerce"
version = "0.1.0"
description = "End-to-end Modern Data Stack for e-commerce: dbt + DuckDB + Evidence + Dagster"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Nikolay Jamgaryan" }
]
license = { text = "MIT" }

# Production dependencies — what's needed to run the code
dependencies = [
    # Core: warehouse + dbt
    "duckdb~=1.1.0",
    "dbt-core~=1.9.0",
    "dbt-duckdb~=1.9.0",
    
    # Data manipulation
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    
    # Synthetic data generation
    "faker>=33.0.0",
    
    # Modern ingestion
    "dlt[duckdb]>=1.4.0",
]

[project.optional-dependencies]
# Development tools — for working on the project
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.7.0",
    "sqlfluff>=3.2.0",
    "sqlfluff-templater-dbt>=3.2.0",
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]

# Optional: workflow orchestration
orchestration = [
    "dagster>=1.9.0",
    "dagster-dbt>=0.25.0",
    "dagster-webserver>=1.9.0",
]

# Optional: data observability
observability = [
    "elementary-data[duckdb]>=0.16.0",
]

# Optional: semantic layer
semantic = [
    "dbt-metricflow[duckdb]>=0.7.0",
]

# Convenience: install everything
all = [
    "modern-data-stack-ecommerce[dev,orchestration,observability,semantic]",
]

# ============================================================
# Tool configurations (consolidated in one place)
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
